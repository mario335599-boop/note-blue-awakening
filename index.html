let returnState='title';function guide(){if(state==='play')state='pause';returnState=state;box('<div class="eyebrow">FIELD MANUAL</div><h2 class="heading">青い光を、使いこなせ。</h2><div class="help"><section><h3>移動と戦闘</h3><p>← → / A D：移動<br>Z / Space：ジャンプ。押す長さで高さが変化<br>C / Shift：地上・空中ダッシュ<br>X / J：射撃。長押しして離すとチャージ弾<br>Q / E：獲得した特殊武器を切り替え<br>F：Eタンク使用　Esc：一時停止</p></section><section><h3>壁を味方にする</h3><p>壁に向かって方向キーを押すと壁滑り。<br>そのままジャンプすると壁蹴り。<br>ダッシュ中のジャンプは遠くまで飛べる。<br>空中ダッシュは着地か壁蹴りで再使用可能。<br>落下・敗北時は直近のチェックポイントから再開。</p></section><section><h3>8つの武器と探索</h3><p>ボス撃破で特殊武器を獲得。ボスには弱点武器がある。武器エネルギーは徐々に回復。<br>各ステージのハートコアで最大HPが増加。<br>緑の球はHP回復、金の球はEタンク。<br>中間地点とボス入口でHP・エネルギー回復。特殊武器には、それぞれ異なる通常技とチャージ技があります。</p></section><section><h3>ゲームパッド / タッチ</h3><p>十字キー・左スティック：移動<br>A：ジャンプ　X：射撃　B / RT：ダッシュ<br>LB / RB：武器変更　Start：一時停止<br>スマートフォンは画面下のボタンで操作。<br>音量は端末側で調整できます。</p></section></div><div class="actions"><button class="primary" onclick="closeGuide()">戻る →</button></div>')}

function updatePlatforms(dt){level.clock+=dt;for(const s of platforms){
 if(s.phasing)s.active=Math.sin(level.clock*s.speed+s.phase)>-.35;

 if(s.conveyor&&player.support===s&&player.ground)player.x+=s.conveyor*dt;
 if(!s.motion)continue;const ox=s.x,oy=s.y;s.x=s.baseX+(s.motion==='x'?Math.sin(level.clock*s.speed+s.phase)*s.amp:0);s.y=s.baseY+(s.motion==='y'?Math.sin(level.clock*s.speed+s.phase)*s.amp:0);s.dx=s.x-ox;s.dy=s.y-oy;if(player.support===s&&player.ground&&s.active!==false){player.x+=s.dx;player.y+=s.dy}}

function drawRasterPlatform(s){const f=terrainFrame(s);if(!f)return false;if(s.x-cam>W+100||s.x+s.w-cam< -100)return true;ctx.save();if(s.active===false)ctx.globalAlpha=.16;ctx.imageSmoothingEnabled=false;if(s.floating){const r=platformArtRect(s,f);ctx.drawImage(f.canvas,0,0,f.w,f.h,r.x-cam,r.y,r.w,r.h);if(s.conveyor){for(let n=0;n<s.w;n+=28){const xx=s.x-cam+((n+level.clock*s.conveyor*.3)%s.w+s.w)%s.w;poly([[xx,s.y+4],[xx+Math.sign(s.conveyor)*7,s.y+8],[xx,s.y+12]],'#ffe39c')}}if(s.crumble&&s.breakTime>2){ctx.strokeStyle='#ffbe75';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(s.x-cam+12,s.y);ctx.lineTo(s.x-cam+s.w*.45,s.y+6);ctx.lineTo(s.x-cam+s.w*.55,s.y);ctx.stroke()}}else if(s.w<80&&s.h>150){for(let yy=0;yy<s.h;yy+=96){const hh=Math.min(96,s.h-yy);ctx.drawImage(f.canvas,0,0,f.w,f.h*hh/96,s.x-cam,s.y+yy,s.w,hh)}}else{for(let xx=0;xx<s.w;xx+=128){const ww=Math.min(128,s.w-xx),piece={...s,x:s.x+xx,w:ww},r=platformArtRect(piece,f);ctx.drawImage(f.canvas,0,0,f.w,f.h,r.x-cam,r.y,r.w,r.h)}}ctx.restore();return true}
function drawRasterGate(d){const img=art.gates;if(!img?.frames)return false;const open=img.frames[level.id*2+1],closed=img.frames[level.id*2],a=open.aperture;const w=d.w/a.width,h=d.h/a.height,x=d.x-cam-a.left*w,y=d.y-a.top*h;ctx.drawImage(open.canvas,0,0,open.w,open.h,x,y,w,h);const visible=d.h*(1-d.open);if(visible>.1){ctx.save();ctx.beginPath();ctx.rect(d.x-cam,d.y,d.w,visible);ctx.clip();ctx.drawImage(closed.canvas,0,0,closed.w,closed.h,x,y,w,h);ctx.restore()}return true}
function drawItem(it){const index=it.type==='heart'?2:it.type==='tank'?1:0,feet=it.y+20+Math.sin(time*4)*3,c=it.type==='heart'?'#ff8cab':it.type==='tank'?'#ffe18a':'#87ffbc';ctx.save();ctx.shadowColor=c;ctx.shadowBlur=9;sprite('pickups',index,it.x-cam+9,feet,27,1,1,36);ctx.restore();if(Math.abs(player.x-it.x)<135)text(it.type==='heart'?'最大HP +3':it.type==='tank'?'Eタンク':'HP回復',it.x-cam+9,feet-34,9,c,'center')}

function drawPlatform(s){if(drawRasterPlatform(s))return;const x=s.x-cam;if(s.active===false){ctx.save();ctx.globalAlpha=.15;drawFloatingDeck(s,x);ctx.restore();return}if(s.crumble&&s.breakTime>2){rect(x,s.y-3,s.w,2,'#ffb46b')}if(s.conveyor){for(let n=10;n<s.w;n+=25)poly([[x+n,s.y+6],[x+n+Math.sign(s.conveyor)*8,s.y+11],[x+n,s.y+16]],'#ffd184')}if(s.organic){rect(x+4,s.y+17,s.w-8,6,'#3c6e48');for(let n=10;n<s.w;n+=23)poly([[x+n,s.y+19],[x+n+13,s.y+29],[x+n+4,s.y+30]],'#77a956')}if(s.floating){drawFloatingDeck(s,x);return}if(x>980||x+s.w<0)return;const t=level.theme;const stone=t==='forest'||t==='mine',base=stone?(t==='forest'?'#243e33':'#342b43'):'#182b3c',edge=t==='fire'?'#98604a':t==='ice'?'#b3d8e6':t==='forest'?'#5d8b48':t==='mine'?'#7c6394':'#617b91';rect(x,s.y,s.w,s.h,base);rect(x,s.y,s.w,3,edge);rect(x,s.y+3,s.w,3,t==='ice'?'#e4ffff':stone?'#3d5448':'#334c61');if(stone){for(let a=0;a<s.w;a+=32){const v=(a/32)%3;rect(x+a+2,s.y+8,27,11,['#3c5046','#304336','#42564a'][v]);rect(x+a+7,s.y+22,22,12,t==='mine'?'#493a57':'#2b4439');rect(x+a+1,s.y+36,30,1,'#121e24');if(t==='forest'){rect(x+a,s.y-3,17,4,'#65914d');rect(x+a+6,s.y-7,3,6,'#9aae59');if(s.h>30){rect(x+a+13,s.y+6,2,23,'#63845a');rect(x+a+11,s.y+14,6,2,'#496d45')}}}}else{for(let a=0;a<s.w;a+=48){rect(x+a+2,s.y+9,42,Math.min(20,s.h-10),'#273e51');rect(x+a+6,s.y+12,3,3,'#a0acb4');rect(x+a+37,s.y+12,3,3,'#778c9b');rect(x+a+10,s.y+18,22,2,'#132535');if(s.h>40){rect(x+a+2,s.y+35,42,3,'#3d5062');rect(x+a+8,s.y+42,28,18,'#1c3141');if(t==='fire'||t==='final'){rect(x+a+11,s.y+48,22,2,t==='final'?'#a42f54':'#a5593d')}else rect(x+a+12,s.y+49,16,2,'#385b74')}}if(t==='ice')for(let a=0;a<s.w;a+=25)poly([[x+a,s.y+6],[x+a+7,s.y+6],[x+a+3,s.y+18]],'#9bcad9')} }

function render(){document.querySelector('#app').classList.toggle('is-boss-intro',!!intro&&state==='play');document.querySelector('#app').classList.toggle('is-playing',state==='play'&&!intro&&!outro&&!tutorial&&finishTimer<=0);if(tutorial){drawLabTutorial();return}if(state==='story'){drawStory();return}if(state==='credits'){drawCredits();return}if(preview&&state==='preview'){drawForecast();return}background();if(!level||!player){note(460,370,1,'idle');return}ctx.save();ctx.translate(shake?rand(-shake,shake):0,shake?rand(-shake*.5,shake*.5):0);
platforms.forEach(drawPlatform);drawDoor();drawDoor(exitDoor);
hazards.forEach(drawHazard);if(!bossStarted)drawCheckpoint();
for(const it of items)if(!it.taken)drawItem(it);
enemies.filter(e=>e.hp>0).forEach(enemyDraw);bossDraw();trails.forEach(a=>note(a.x-cam,a.y,a.dir,'dash',a.life*1.5));if(!death&&!outro&&(tutorial||finishTimer>0||player.inv<=0||Math.floor(time*18)%2===0))note(player.x-cam,player.y,player.dir,player.dash>0?'dash':!player.ground?'air':Math.abs(player.vx)>40?'run':'idle');
if(death)drawDeath();bullets.forEach(drawProjectile);
particles.forEach(a=>{ctx.globalAlpha=Math.min(1,a.life*3);rect(a.x-cam,a.y,a.size,a.size,a.color)});ctx.globalAlpha=1;ctx.restore();

drawIntro();drawOutro();drawTutorial();if(flash>0){ctx.globalAlpha=flash*3;rect(0,0,W,H,'#fff');ctx.globalAlpha=1}}
let last=0,acc=0;function loop(ms){let dt=Math.min(.05,(ms-last)/1000||.016);last=ms;acc+=dt;while(acc>=1/120){update(1/120);acc-=1/120}musicUpdate();render();requestAnimationFrame(loop)}
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='Escape'&&state==='pause')resume()});window.addEventListener('keyup',e=>keys[e.code]=false);window.addEventListener('blur',()=>{keys={};if(state==='play')pause()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play')pause()});

function isTouchDevice(){return !!(window.matchMedia?.('(pointer:coarse)').matches)}

function fitMobileSurface(width,height,insets={top:0,right:0,bottom:0,left:0}){const w=Math.max(1,width-insets.left-insets.right),h=Math.max(1,height-insets.top-insets.bottom);const gameWidth=Math.min(w,h*16/9);return {width:gameWidth,height:gameWidth*9/16}}
function sizeMobileViewport(){if(!isTouchDevice())return;const app=document.querySelector('#app'),stage=document.querySelector('#stage'),v=window.visualViewport;const width=v?.width||window.innerWidth,height=v?.height||window.innerHeight;app.style.setProperty('--mobile-width',width+'px');app.style.setProperty('--mobile-height',height+'px');const style=window.getComputedStyle(stage),number=x=>parseFloat(x)||0;const fit=fitMobileSurface(width,height,{top:number(style.paddingTop),right:number(style.paddingRight),bottom:number(style.paddingBottom),left:number(style.paddingLeft)});app.style.setProperty('--game-width',fit.width+'px');app.style.setProperty('--game-height',fit.height+'px')}
function enterMobilePlay(){if(!isTouchDevice())return;document.querySelector('#app').classList.add('mobile-immersive');sizeMobileViewport()}
window.addEventListener('resize',sizeMobileViewport);window.addEventListener('orientationchange',()=>requestAnimationFrame(sizeMobileViewport));window.visualViewport?.addEventListener('resize',sizeMobileViewport);
document.addEventListener('click',e=>{const target=e.target.closest?.('button');if(target&&isTouchDevice()&&(target.classList.contains('primary')||target.classList.contains('card')))enterMobilePlay()},{capture:true});
const touchPointers=new Map();
function releaseTouch(id){const entry=touchPointers.get(id);if(!entry)return;touchPointers.delete(id);keys[entry.code]=Array.from(touchPointers.values()).some(p=>p.code===entry.code);if(!Array.from(touchPointers.values()).some(p=>p.button===entry.button))entry.button.classList.remove('held')}
function clearTouch(){for(const id of Array.from(touchPointers.keys()))releaseTouch(id);keys={};prev={}}
document.querySelectorAll('[data-key]').forEach(button=>{button.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();touchPointers.set(e.pointerId,{code:button.dataset.key,button});button.setPointerCapture?.(e.pointerId);keys[button.dataset.key]=true;button.classList.add('held');if(!audio&&!muted)ensureAudio()},{passive:false});for(const type of ['pointerup','pointercancel','lostpointercapture'])button.addEventListener(type,e=>{e.preventDefault();releaseTouch(e.pointerId)},{passive:false});for(const type of ['contextmenu','selectstart','dragstart'])button.addEventListener(type,e=>e.preventDefault())});
document.querySelector('.touch').addEventListener('touchstart',e=>e.preventDefault(),{passive:false});

window.addEventListener('blur',clearTouch);document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTouch()});
document.querySelector('#pause').onclick=pause;document.querySelector('#help').onclick=guide;document.querySelector('#sound').onclick=()=>{muted=!muted;if(muted){stopCharge();stopPreviewMusic();}document.querySelector('#sound').textContent='音 '+(muted?'OFF':'ON');if(!muted){ensureAudio();audio?.resume();sound();if(state==='preview')playPreviewMusic()}};document.querySelector('#full').onclick=()=>{if(isTouchDevice()){enterMobilePlay();const app=document.querySelector('#app');if(!document.fullscreenElement&&app.requestFullscreen)app.requestFullscreen({navigationUI:'hide'}).then(sizeMobileViewport).catch(()=>{});return}if(document.fullscreenElement)document.exitFullscreen();else document.querySelector('#app').requestFullscreen?.().catch(()=>toast('この環境では全画面表示に対応していません。'))};document.addEventListener('pointerdown',()=>{if(!audio&&!muted)sound(1,.01,'sine',.001)},{once:true});
